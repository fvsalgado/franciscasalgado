# Vigia diário.
#
# Vai ao European Golf Rankings, ao WAGR e ao portal da Federação, escreve o
# que é estruturado nos ficheiros de dados, e abre um issue com o que precisa
# de uma pessoa a decidir.
#
# O que ele escreve entra no ramo de produção; a Vercel publica a seguir,
# sozinha. Não abre ramos nem pull requests: este repositório tem um ramo só.

name: Vigia

on:
  schedule:
    # 06:10 UTC todos os dias — a FPG publica as crónicas ao fim do dia
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Procurar novidades
        id: correr
        run: node scripts/vigia.mjs

      # A ordem importa: as páginas inglesas nascem das portuguesas, e os dados
      # estruturados escrevem-se nas duas. Correndo a seguir ao vigia, o que os
      # motores e os assistentes leem nunca fica atrás do que a página diz.
      - name: Reescrever as páginas em /en/
        run: node scripts/traduzir.mjs

      - name: Refazer dados estruturados, sitemap e llms.txt
        run: node scripts/seo.mjs

      # O sítio pinta o conteúdo no navegador; este passo abre cada página num
      # Chromium e guarda o resultado no ficheiro, para quem lê sem correr
      # JavaScript não receber contentores vazios. Corre aqui, e não só à mão,
      # porque o vigia mexe nos dados todos os dias — sem isto, o que está
      # escrito no HTML ficava a falar de ontem.
      - name: Instalar o Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Escrever no HTML o que o JavaScript pinta
        run: node scripts/estatico.mjs

      - name: Pôr o resumo no sumário da ação
        if: always()
        run: cat VIGIA.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Guardar o que mudou
        id: commit
        run: |
          git config user.name  'Vigia'
          git config user.email 'vigia@users.noreply.github.com'
          if [ -z "$(git status --porcelain data/ sitemap.xml llms.txt ./*.html en/)" ]; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nada de novo."
            exit 0
          fi
          git add data/ sitemap.xml llms.txt ./*.html en/
          git commit -m "Vigia: novidades de $(date -u +%Y-%m-%d)

          $(sed -n '/^- /p' VIGIA.md | head -20)"
          git push
          echo "mudou=sim" >> "$GITHUB_OUTPUT"

      - name: Abrir issue com o que precisa de olhos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s VIGIA-ATENCAO.md ]; then
            echo "Nada que precise de uma pessoa."
            exit 0
          fi

          # Atribuída a quem é dono do repositório, e não só etiquetada.
          #
          # Uma issue sem responsável só dá notificação a quem estiver a vigiar
          # o repositório com «All Activity» — e essa é uma definição que se
          # muda sem dar por isso, num sítio que não tem nada que ver com este
          # projeto. Atribuída, o GitHub notifica sempre: email, telemóvel e o
          # sino lá em cima. É a diferença entre um aviso que chega e um aviso
          # que fica à espera de ser encontrado.
          TITULO="Vigia: há coisas para rever ($(date -u +%Y-%m-%d))"
          DONO='${{ github.repository_owner }}'

          gh issue create --title "$TITULO" --body-file VIGIA-ATENCAO.md \
            --assignee "$DONO" --label vigia 2>/dev/null \
          || gh issue create --title "$TITULO" --body-file VIGIA-ATENCAO.md \
            --assignee "$DONO" 2>/dev/null \
          || gh issue create --title "$TITULO" --body-file VIGIA-ATENCAO.md
