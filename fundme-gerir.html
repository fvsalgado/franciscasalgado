<!doctype html>
<html lang="pt-PT" data-tema="escuro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fotografias — Rumo à Florida</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#091411" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/css/site.css" />
<style>
  /* /fundme/gerir — só para a família: aprovar as fotografias de quem apoia */
  [hidden]{display:none!important}
  body{min-height:100vh;background:var(--papel)}
  .gr{width:min(46rem,100% - 2rem);margin:0 auto;padding:calc(1.4rem + env(safe-area-inset-top)) 0 4rem}
  .gr-cab{display:flex;align-items:center;gap:.7rem}
  .gr-cab svg{width:1.4rem;height:1.4rem;color:var(--relva)}
  .gr-cab h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;flex:1}
  .gr-cab button,.gr-ligar button,.gr-bts button,.gr-soltas button,.gr-filtro button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px}
  .gr-cab button{background:none;border:0;color:var(--tinta-fraca);font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
  .gr-txt{color:var(--tinta-fraca);font-size:.92rem;line-height:1.5;margin:.6rem 0 1.2rem}
  .gr-ligar{display:grid;gap:.6rem;max-width:22rem;margin-top:1.4rem}
  .gr-ligar input{font:inherit;font-size:1rem;color:var(--tinta);background:transparent;border:1px solid var(--linha-forte);border-radius:12px;padding:.8rem .9rem}
  .gr-ligar button,.gr-bts .gr-sim{background:var(--relva);color:var(--papel);border:0;padding:.85rem 1rem;font-size:1rem}
  .gr-erro{color:var(--brasa);font-weight:600;font-size:.9rem;margin:.6rem 0 0}
  .gr-filtro{display:flex;gap:.4rem;margin:1.2rem 0 1rem}
  .gr-filtro button{background:transparent;border:1px solid var(--linha-forte);color:var(--tinta);padding:.5rem .9rem;font-size:.86rem}
  .gr-filtro button[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
  .gr-lista{list-style:none;padding:0;margin:0;display:grid;gap:1rem}
  .gr-f{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;padding:1rem;border:1px solid var(--linha);border-radius:16px;background:var(--superficie)}
  .gr-f--pendente{border-color:var(--relva);box-shadow:0 0 0 1px var(--relva)}
  .gr-f img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--linha);cursor:zoom-in;display:block}
  .gr-f h2{font-size:1rem;margin:0;font-weight:800}
  .gr-f p{margin:.3rem 0 0;font-size:.9rem;color:var(--tinta-fraca);line-height:1.45}
  .gr-f .gr-msg{font-family:var(--display);font-style:italic;color:var(--tinta);font-size:1.02rem}
  .gr-chip{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:99px;margin-left:.4rem;vertical-align:.1em}
  .gr-chip--pendente{background:var(--relva);color:var(--papel)}
  .gr-chip--aprovada{background:var(--relva-clara);color:var(--tinta)}
  .gr-chip--recusada{background:var(--linha);color:var(--tinta-fraca)}
  .gr-bts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
  .gr-bts button{padding:.65rem .95rem;font-size:.92rem}
  .gr-bts .gr-nao{background:transparent;color:var(--tinta);border:1px solid var(--linha-forte)}
  .gr-bts button:disabled{opacity:.5;cursor:default}
  .gr-vazio{color:var(--tinta-fraca);font-style:italic}
  .gr-soltas{margin-top:2rem;font-size:.86rem;color:var(--tinta-fraca);display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
  .gr-soltas button{background:transparent;border:1px solid var(--linha-forte);color:var(--tinta);padding:.45rem .8rem;font-size:.82rem}
  .gr-grande{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:1rem;cursor:zoom-out}
  .gr-grande img{max-width:100%;max-height:100%;object-fit:contain}
  @media (max-width:420px){.gr-f{grid-template-columns:5.6rem 1fr;gap:.8rem;padding:.8rem}}
</style>
</head>
<body>
<main class="gr">
  <div class="gr-cab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M6 21V3l11 4-11 4"/></svg>
    <h1>Fotografias</h1>
    <button type="button" id="grSair" hidden>Sair</button>
  </div>
  <p class="gr-txt" id="grTxt">As fotografias de quem apoia o «Rumo à Florida». Só aparecem na página e no ecrã do clube depois de carregar em «Mostrar».</p>

  <form class="gr-ligar" id="grLigar" hidden>
    <label for="grChave" class="so-leitor">Chave</label>
    <input id="grChave" type="password" autocomplete="current-password" placeholder="A chave" required />
    <button type="submit">Entrar</button>
  </form>
  <p class="gr-erro" id="grErro" role="alert" hidden></p>

  <div id="grConteudo" hidden>
    <div class="gr-filtro" role="group" aria-label="Mostrar">
      <button type="button" data-f="pendente" aria-pressed="true">À espera <span id="grN"></span></button>
      <button type="button" data-f="todas" aria-pressed="false">Todas</button>
    </div>
    <ul class="gr-lista" id="grLista"></ul>
    <p class="gr-soltas" id="grSoltas" hidden></p>
  </div>
</main>
<script type="module" src="/js/fundme-gerir.js"></script>
</body>
</html>
